version: "3.9"

services:
  postgres: 
    image: postgres:14
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: user
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"
    
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis
    container_name: redis
    restart: unless-stopped

    ports:
      - "6379:6379"

volumes:
  db_data: 